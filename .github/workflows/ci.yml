name: CI

# The deterministic gates CONTRIBUTING.md promises must stay green on every PR.
# Pure stdlib, so there is nothing to install.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile (tools + tests)
        run: python3 -m py_compile tools/*.py tests/*.py
      - name: Adjudicator unit tests (the anti-slop invariants)
        run: python3 tests/test_adjudicator.py
      - name: AI-style-screen unit tests (AIS-DEFENSIVE-HEDGE FP boundaries + zero-weight)
        run: python3 tests/test_ai_style.py
      - name: Primary-PDF selection unit tests (honest-none + determinism, issue #11)
        run: python3 tests/test_select_primary_pdf.py
      - name: Embedded-python syntax lint (SKILL.md validator blocks parse; stamps define-before-use)
        run: python3 tests/test_embedded_python.py
      - name: Deterministic counter-check unit tests (open intervals, Decimal, UNRESOLVABLE-on-ambiguity)
        run: python3 tests/test_countercheck.py
      - name: Report self-binding unit tests (coverage_provenance + audited_content_fingerprint, issue #17)
        run: python3 tests/test_report_provenance.py
      - name: Eval harness (clean + corruption fixtures — 100% recall, 0 clean FP)
        run: python3 eval/run_eval.py
